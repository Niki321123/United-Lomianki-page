<!doctype html>

  <meta name="theme-color" content="#141414">
  <link rel="icon" href="assets/img/herb.png" type="image/png">

  <meta property="og:title" content="Aktualności – Łomianki United">
  <meta property="og:description" content="Aktualności klubu Łomianki United.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/cards.css">

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <!-- AKTUALNOŚCI -->
    <section id="aktualnosci" class="section" aria-labelledby="news-title">
      <div class="container">
        <div class="section-head">
          <h1 id="news-title" class="page-title">Aktualności</h1>
        </div>
        <div class="news-grid" id="news-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <dialog class="news-dialog" id="news-dialog" aria-labelledby="news-dialog-title">
    <form method="dialog">
      <button class="dialog-close" aria-label="Zamknij">×</button>
    </form>
    <p class="news-date" id="news-dialog-date"></p>
    <h2 id="news-dialog-title"></h2>
    <div id="news-dialog-body"></div>
  </dialog>

  <dialog class="photo-viewer" id="photo-viewer" aria-label="Zdjęcie z galerii">
    <form method="dialog"><button class="dialog-close" aria-label="Zamknij">×</button></form>
    <img id="photo-viewer-img" alt="">
    <button class="photo-nav photo-prev" type="button" id="photo-prev" aria-label="Poprzednie zdjęcie">‹</button>
    <button class="photo-nav photo-next" type="button" id="photo-next" aria-label="Następne zdjęcie">›</button>
    <p class="photo-count" id="photo-viewer-count" aria-live="polite"></p>
  </dialog>

  <noscript>
    <p class="noscript">Włącz JavaScript, aby zobaczyć treść strony.</p>
  </noscript>
