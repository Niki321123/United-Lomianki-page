<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt – Łomianki United</title>
  <meta name="description" content="Kontakt i boisko Łomianki United.">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="assets/img/herb.png" type="image/png">

  <meta property="og:title" content="Kontakt – Łomianki United">
  <meta property="og:description" content="Kontakt i boisko Łomianki United.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/cards.css">

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <!-- KONTAKT -->
    <section id="kontakt" class="section" aria-labelledby="contact-title">
      <div class="container contact-grid">
        <div>
          <h1 id="contact-title" class="page-title">Kontakt</h1>
          <dl class="contact-list" id="contact-list"></dl>
          <ul class="socials" id="socials" aria-label="Media społecznościowe"></ul>
        </div>
        <div class="venue-card">
          <p class="eyebrow">Nasze boisko</p>
          <h3 data-bind="venue.name"></h3>
          <p data-bind="venue.address"></p>
          <p class="muted" data-bind="venue.note"></p>
          <a class="btn btn-primary" id="map-link" target="_blank" rel="noopener">Pokaż na mapie</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <noscript>
    <p class="noscript">Włącz JavaScript, aby zobaczyć treść strony.</p>
  </noscript>
</body>
</html>
