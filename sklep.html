<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sklep – Łomianki United</title>
  <meta name="description" content="Oficjalny sklep Łomianki United – koszulki, bluzy i gadżety klubowe.">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="assets/img/herb.png" type="image/png">

  <meta property="og:title" content="Sklep – Łomianki United">
  <meta property="og:description" content="Oficjalny sklep Łomianki United – koszulki, bluzy i gadżety klubowe.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/shop.css">

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/shop.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="section" aria-labelledby="shop-title">
      <div class="container">
        <div class="section-head">
          <h1 id="shop-title" class="page-title">Sklep</h1>
          <button class="cart-button" type="button" id="cart-open" aria-haspopup="dialog">
            Koszyk <span class="cart-count" id="cart-count">0</span>
          </button>
        </div>
        <p class="shop-notice" id="shop-notice" role="status" hidden></p>
        <div class="shop-grid" id="products"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <dialog class="cart" id="cart" aria-labelledby="cart-title">
    <div class="cart-head">
      <h2 id="cart-title">Koszyk</h2>
      <form method="dialog"><button class="dialog-close" aria-label="Zamknij koszyk">×</button></form>
    </div>
    <ul class="cart-lines" id="cart-lines"></ul>
    <div class="cart-foot">
      <p class="cart-total">Razem <strong id="cart-total">0,00 zł</strong></p>
      <p class="cart-hint">Dostawę wybierzesz na stronie płatności.</p>
      <button class="btn btn-primary cart-pay" type="button" id="checkout">Przejdź do płatności</button>
      <p class="cart-msg" id="cart-msg" role="status"></p>
    </div>
  </dialog>

  <noscript>
    <p class="noscript">Włącz JavaScript, aby zobaczyć sklep.</p>
  </noscript>
</body>
</html>
